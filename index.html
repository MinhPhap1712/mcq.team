<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khảo Sát Trực Tuyến Từ Excel</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6 flex flex-col items-center">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-lg p-6 mb-6">
        <h1 class="text-2xl font-bold text-center text-indigo-600 mb-4">📊 HỆ THỐNG KHẢO SÁT TỪ EXCEL</h1>
        
        <div class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-xl p-6 bg-gray-50">
            <p class="text-sm text-gray-500 mb-3">Chọn file câu hỏi Excel (.xlsx) của bạn</p>
            <input type="file" id="excelFile" accept=".xlsx" class="mb-3 text-sm text-gray-600">
            <button onclick="uploadExcel()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-lg transition shadow cursor-pointer">
                Tải câu hỏi lên
            </button>
        </div>
    </div>

    <div id="quizContainer" class="w-full max-w-3xl space-y-6 hidden"></div>

    <script>
        let questionsList = [];

        async function uploadExcel() {
            const fileInput = document.getElementById('excelFile');
            if (fileInput.files.length === 0) return alert('Vui lòng chọn một file Excel trước!');

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('https://mcq-team.onrender.com/api/upload-excel', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    questionsList = data.questions;
                    renderQuestions(); 
                } else {
                    alert(data.error);
                }
            } catch (err) {
                alert('Không thể kết nối tới server backend! Bạn đã chạy lệnh node server.js chưa?');
            }
        }

        function renderQuestions() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';
            container.classList.remove('hidden');

            questionsList.forEach((q) => {
                let mediaHtml = '';
                if (q.media) {
                    if (q.media.match(/\.(mp4|webm|ogg)$/i) || q.media.includes('mov_bbb')) {
                        mediaHtml = `<video src="${q.media}" controls class="max-w-full h-48 rounded-lg my-3 mx-auto"></video>`;
                    } else {
                        mediaHtml = `<img src="${q.media}" class="max-w-full h-48 object-cover rounded-lg my-3 mx-auto" alt="Hình ảnh câu hỏi">`;
                    }
                }

                const qCard = document.createElement('div');
                qCard.className = "bg-white p-6 rounded-xl shadow border border-gray-100";
                qCard.innerHTML = `
                    <p class="font-bold text-gray-800 text-lg">Câu ${q.id}: ${q.question}</p>
                    ${mediaHtml}
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4" id="options-box-${q.id}">
                        <button onclick="checkAnswer(${q.id}, 'a')" id="btn-${q.id}-a" class="p-3 text-left border rounded-xl hover:bg-gray-50 transition font-medium cursor-pointer">A. ${q.options.a}</button>
                        <button onclick="checkAnswer(${q.id}, 'b')" id="btn-${q.id}-b" class="p-3 text-left border rounded-xl hover:bg-gray-50 transition font-medium cursor-pointer">B. ${q.options.b}</button>
                        <button onclick="checkAnswer(${q.id}, 'c')" id="btn-${q.id}-c" class="p-3 text-left border rounded-xl hover:bg-gray-50 transition font-medium cursor-pointer">C. ${q.options.c}</button>
                        <button onclick="checkAnswer(${q.id}, 'd')" id="btn-${q.id}-d" class="p-3 text-left border rounded-xl hover:bg-gray-50 transition font-medium cursor-pointer">D. ${q.options.d}</button>
                    </div>
                    <p id="feedback-${q.id}" class="mt-3 font-semibold text-sm hidden"></p>
                `;
                container.appendChild(qCard);
            });
        }

        function checkAnswer(questionId, selectedOption) {
            const question = questionsList.find(q => q.id === questionId);
            const correctOpt = question.answer; 

            const optionsBox = document.getElementById(`options-box-${questionId}`);
            const buttons = optionsBox.getElementsByTagName('button');
            for (let btn of buttons) {
                btn.disabled = true;
                btn.classList.remove('cursor-pointer');
                btn.classList.add('cursor-not-allowed');
            }

            const selectedBtn = document.getElementById(`btn-${questionId}-${selectedOption}`);
            const correctBtn = document.getElementById(`btn-${questionId}-${correctOpt}`);
            const feedbackText = document.getElementById(`feedback-${questionId}`);

            feedbackText.classList.remove('hidden');

            if (selectedOption === correctOpt) {
                selectedBtn.classList.add('bg-green-100', 'border-green-500', 'text-green-700');
                feedbackText.innerText = "🎉 Bạn đã trả lời đúng!";
                feedbackText.className = "mt-3 font-semibold text-sm text-green-600";
            } else {
                selectedBtn.classList.add('bg-red-100', 'border-red-500', 'text-red-700');
                if (correctBtn) {
                    correctBtn.classList.remove('bg-gray-50');
                    correctBtn.classList.add('bg-green-100', 'border-green-500', 'text-green-700');
                }
                feedbackText.innerText = `❌ Sai rồi! Đáp án đúng phải là: ${correctOpt.toUpperCase()}`;
                feedbackText.className = "mt-3 font-semibold text-sm text-red-600";
            }
        }
    </script>
</body>
</html>
